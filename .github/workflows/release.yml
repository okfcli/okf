# Release workflow: on a semver tag push (vX.Y.Z), runs GoReleaser to build
# multi-platform binaries and publish a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least-privilege default; the goreleaser job grants itself the write scopes
# it needs.
permissions: {}

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protected environment gating the tap-push secret (TAP_APP_PRIVATE_KEY);
    # its deployment policy only allows v*.*.* tags.
    environment: release
    permissions:
      contents: write   # create the GitHub Release + upload assets
      id-token: write   # cosign keyless signing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Short-lived installation token for pushing the cask to homebrew-okf.
      # The App has Contents read/write on that one repository only; the
      # token expires after an hour and is revoked when the job ends.
      - name: Mint tap push token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: okfcli
          repositories: homebrew-okf

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

# Release workflow: on a semver tag push (vX.Y.Z), runs GoReleaser to build
# multi-platform binaries and publish a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least-privilege default; the goreleaser job grants itself the write scopes
# it needs.
permissions: {}

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protected environment gating the tap-push secret (TAP_APP_PRIVATE_KEY);
    # its deployment policy only allows v*.*.* tags.
    environment: release
    permissions:
      contents: write   # create the GitHub Release + upload assets
      id-token: write   # cosign keyless signing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Short-lived installation token for pushing the cask to homebrew-okf.
      # The App has Contents read/write on that one repository only; the
      # token expires after an hour and is revoked when the job ends.
      - name: Mint tap push token
        id: tap-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: okfcli
          repositories: homebrew-okf

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

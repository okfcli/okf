# GoReleaser config. Triggered by the release.yml workflow on v*.*.* tags.
# Builds multi-platform binaries for Linux, macOS, and Windows.
# See https://goreleaser.com for documentation.
version: 2

project_name: okf

before:
  hooks:
    - go mod tidy

builds:
  - id: okf
    main: ./cmd/okf
    binary: okf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Other
      order: 999

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  github:
    owner: okfcli
    name: okf
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

# Publishes the okf cask to the tap on every non-prerelease release. The token
# is a short-lived GitHub App installation token minted in release.yml; the
# default Actions token cannot push to a second repository.
homebrew_casks:
  - name: okf
    homepage: https://github.com/okfcli/okf
    description: "Go CLI toolkit for the Open Knowledge Format (OKF), agentic-first and JSON-native"
    skip_upload: auto
    url:
      verified: github.com/okfcli/okf/
    # The binaries are not signed or notarized, so strip the Gatekeeper
    # quarantine bit on macOS; without this, users get "okf is damaged and
    # cannot be opened".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/okf"]
          end
    repository:
      owner: okfcli
      name: homebrew-okf
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
